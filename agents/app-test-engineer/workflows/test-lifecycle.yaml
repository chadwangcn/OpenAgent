schema_version: openagent.workflow.v1
workflow_id: app-test-lifecycle
version: 0.2.0
states:
  - intake
  - preflight
  - environment_ready
  - running
  - analyzing
  - evidence_ready
  - in_review
  - retest_pending
  - accepted
  - blocked
transitions:
  - from: intake
    to: preflight
    requires: [task_inputs_complete]
  - from: preflight
    to: environment_ready
    requires: [figma_resolved, case_set_pinned, apk_digest_verified, prismloop_capabilities_verified]
  - from: environment_ready
    to: running
    requires: [device_lease_acquired]
  - from: running
    to: analyzing
    requires: [terminal_tool_result]
  - from: analyzing
    to: evidence_ready
    requires: [case_assertions_evaluated, self_check_completed, failure_classification]
  - from: evidence_ready
    to: in_review
    requires: [test_run_receipt, evidence_index, subject_and_case_pins_preserved]
  - from: in_review
    to: retest_pending
    requires: [fix_delivery_notice]
  - from: retest_pending
    to: running
    requires: [new_subject_digest, same_or_explicitly_updated_case_set]
  - from: in_review
    to: accepted
    requires: [all_required_cases_passed, independent_evidence_complete, named_acceptance_record]
artifacts:
  input: [task_intent, figma_pin, case_set_pin, apk_digest, environment_ref]
  execution: [terminal_tool_result, evidence_index, test_run_receipt]
  feedback: [finding_notice, improvement_candidate]
paperclip_status_mapping:
  ready: todo
  active: in_progress
  evidence_ready: in_review
  waiting_dependency_or_authority: backlog_with_blocker_notice
  terminal: done_after_named_acceptance_only
stop_conditions:
  - missing_required_input
  - missing_secret_binding
  - capability_unavailable
  - evidence_integrity_failure
  - subject_or_case_changed_during_run
